name: Deploy server

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/deploy-server.yml"]
  workflow_dispatch: {}

concurrency: { group: deploy-fantasy2-server, cancel-in-progress: false }

env:
  DEPLOY_HOST: 45.90.123.41
  DEPLOY_USER: fantasy2hub
  APP_DIR: /home/fantasy2hub/fantasy2-hub
  SERVICE_NAME: fantasy2-hub
  HEALTH_PORT: 3100

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.FANTASY2_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR='$APP_DIR' SERVICE_NAME='$SERVICE_NAME' HEALTH_PORT='$HEALTH_PORT' bash -s" <<'REMOTE'
          set -euo pipefail
          export PATH=/opt/node22/bin:$PATH
          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main
          cd server
          npm ci --omit=dev
          node --env-file=.env src/db/migrate.js
          node --env-file=.env src/db/seed-apartments.js
          node --env-file=.env scripts/migrate-uploads-to-r2.js
          sudo -n systemctl restart "$SERVICE_NAME"
          sleep 2
          sudo -n systemctl is-active "$SERVICE_NAME"
          curl -f -s -o /dev/null "http://127.0.0.1:$HEALTH_PORT/health"
          echo "deploy ok: $(git rev-parse --short HEAD)"

          # RAG reindex pós-deploy (best-effort): não derruba o deploy se falhar.
          # Roda depois do healthcheck para não atrasar/bloquear a subida do serviço.
          echo "rag:reindex — iniciando (até 3 tentativas)…"
          reindex_ok=0
          for attempt in 1 2 3; do
            if node --env-file=.env scripts/rag-reindex.js; then
              echo "rag:reindex ok (tentativa $attempt)"
              reindex_ok=1
              break
            fi
            echo "rag:reindex falhou (tentativa $attempt/3); retry em 15s…" >&2
            sleep 15
          done
          if [ "$reindex_ok" -ne 1 ]; then
            echo "AVISO: rag:reindex falhou após 3 tentativas — deploy segue ok; rode manualmente: cd $APP_DIR/server && npm run rag:reindex" >&2
          fi
          REMOTE
